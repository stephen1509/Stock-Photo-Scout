name: Temporary 0.05A verification
on:
  push:
    branches: [main]
jobs:
  full-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run full unittest suite
        run: python -m unittest discover -s tests -v
